<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projeto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<aside id="side"></aside>
<div class="detalhe" id="det"><p class="aviso" style="padding:48px">Carregando projeto…</p></div>
<script src="/js/app.js"></script>
<script>
const det = document.getElementById('det');
(async () => {
  try {
    await montarSidebar('projetos');
    const id = new URLSearchParams(location.search).get('id');
    const p = await api(`/api/projetos/${encodeURIComponent(id)}/`);
    document.title = p.titulo;
    const techs = (p.tecnologias || '').trim();
    det.innerHTML = `
      <div class="banner" aria-hidden="true">${esc(p.titulo[0].toUpperCase())}</div>
      <div class="corpo">
        <a class="voltar" href="/projetos.html" aria-label="Voltar para projetos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 5-7 7 7 7"/></svg>
        </a>
        <h1>${esc(p.titulo)}</h1>
        <h2>Introdução:</h2>
        <p id="desc" class="clamp">${esc(p.descricao)}</p>
        <button class="mais" id="mais" aria-expanded="false">Leia Mais</button>
        ${techs ? `<h2>Tecnologias:</h2><p>${esc(techs)}</p>` : ''}
        ${p.link_repositorio ? `<a class="repo" href="${esc(p.link_repositorio)}" target="_blank" rel="noopener">Ver repositório</a>` : ''}
      </div>`;
    const d = document.getElementById('desc'), b = document.getElementById('mais');
    if (d.scrollHeight <= d.clientHeight) b.hidden = true;
    b.onclick = () => {
      const aberto = d.classList.toggle('clamp') === false;
      b.textContent = aberto ? 'Leia Menos' : 'Leia Mais';
      b.setAttribute('aria-expanded', aberto);
    };
  } catch (e) {
    det.innerHTML = '<p class="aviso" style="padding:48px">Projeto não encontrado. <a href="/projetos.html"><u>Voltar para projetos</u></a></p>';
  }
})();
</script>
</body>
</html>
