<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<aside id="side"></aside>
<main>
  <h1>Ideias com Intenção</h1>
  <div class="busca">
    <input id="q" type="search" placeholder="Busque por um projeto" aria-label="Buscar projeto">
    <div class="chips" id="chips">
      <button class="chip" data-f="" aria-pressed="true">Todos</button>
      <button class="chip" data-f="artes" aria-pressed="false">Artes</button>
      <button class="chip" data-f="educa" aria-pressed="false">Educação</button>
    </div>
  </div>
  <div class="lista" id="lista"><p class="aviso">Carregando projetos…</p></div>
</main>
<script src="/js/app.js"></script>
<script>
let todos = [], filtro = '';
const lista = document.getElementById('lista');

function desenhar() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const vis = todos.filter(p => {
    const txt = `${p.titulo} ${p.descricao} ${p.tecnologias}`.toLowerCase();
    return txt.includes(q) && txt.includes(filtro);
  });
  lista.innerHTML = vis.length ? vis.map(p => `
    <article class="item">${capaHtml(p)}
      <div class="txt"><h2>${esc(p.titulo)}</h2><p>${esc(p.descricao)}</p>
        <a class="ir" href="/projeto.html?id=${p.id}" aria-label="Abrir ${esc(p.titulo)}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg>
        </a></div>
    </article>`).join('')
    : `<p class="aviso">${todos.length ? 'Nenhum projeto encontrado. Tente outra busca ou filtro.' : 'Você ainda não tem projetos publicados.'}</p>`;
}

document.getElementById('q').addEventListener('input', desenhar);
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  desenhar();
});

(async () => {
  try {
    await montarSidebar('projetos');
    todos = await listarProjetos();
    desenhar();
  } catch (e) {
    lista.innerHTML = '<p class="aviso">Não foi possível carregar os projetos. Verifique se o servidor está no ar. <button onclick="location.reload()">Tentar de novo</button></p>';
  }
})();
</script>
</body>
</html>
